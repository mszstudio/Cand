[workspace]
resolver = "2"
members = [
    "crates/cand-lexer",
    "crates/cand-ast",
    "crates/cand-parser",
    "crates/cand-diagnostics",
    "crates/cand-semantic",
    "crates/cand-types",
    "crates/cand-ir",
    "crates/cand-codegen",
    "crates/cand-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MSZ Studio"]
license = "MIT"
repository = "https://github.com/MSZ-Studio/c-and"
homepage = "https://github.com/MSZ-Studio/c-and"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
